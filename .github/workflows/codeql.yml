name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # actions: workflow YAML; swift: app sources
        language: [actions, swift]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        if: matrix.language != 'swift'
        uses: github/codeql-action/autobuild@v3

      - name: Build (Swift / Xcode)
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          DEST=$(python3 <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              for dev in devices:
                  if dev.get("isAvailable", True) and "iPhone" in dev.get("name", ""):
                      print(f"platform=iOS Simulator,id={dev['udid']}")
                      raise SystemExit
          print("platform=iOS Simulator,name=iPhone 16")
          PY
          )
          xcodebuild \
            -scheme PocketLittleFarm \
            -project PocketLittleFarm.xcodeproj \
            -destination "$DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
