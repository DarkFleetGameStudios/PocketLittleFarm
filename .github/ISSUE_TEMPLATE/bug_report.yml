name: Bug report
description: Something broken in the farm, build, or CI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security** issues use [private vulnerability reporting](https://github.com/DarkFleetGameStudios/PocketLittleFarm/security/advisories/new), not this form.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open app
        2. Plant radish
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / commit
      description: App version or git SHA if known
  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: iPhone 15 Pro, iOS 18.x / Simulator
