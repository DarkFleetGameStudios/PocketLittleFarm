name: PocketLittleFarm
options:
  bundleIdPrefix: com.pocketlittlefarm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pocket Little Farm
    INFOPLIST_KEY_LSRequiresIPhoneOS: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: TMYF9PC8GV
    CODE_SIGN_STYLE: Automatic
targets:
  PocketLittleFarm:
    type: application
    platform: iOS
    sources:
      - path: PocketLittleFarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketlittlefarm.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
    info:
      path: PocketLittleFarm/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PocketLittleFarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketLittleFarmTests
    dependencies:
      - target: PocketLittleFarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketlittlefarm.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketLittleFarm:
    build:
      targets:
        PocketLittleFarm: all
        PocketLittleFarmTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketLittleFarmTests
